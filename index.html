<!DOCTYPE html>
<html > 
<head> 
    <title>Login</title>
    <link rel="stylesheet" href="stile.css">
</head>

<body>
    <div class="login">
        <form class="posizione" >
            <h1 style="color: white;">Login</h1>
            <label  style=" color: white;">Username:</label>
            <input type="text" class="text" id="user" placeholder="username / mail">
            <label style="color: white;">Password:</label>
            <div class="linea">
                <input type="password" class="ps" id="psd" placeholder="password di almeno 8 caratteri">
                <input type="checkbox" class="psw" id="check" onclick="psd.type = this.
                checked ? 'text' : 'password'">                      
            </div>            
            <button type="button" onclick="alert('Login eseguito con successo!') ; document.getElementById('user').value='' ; document.getElementById('psd').value='' ; document.getElementById('check').checked = false "> Sign in</button>
        </form>
    </div>
</body>    
</html>
